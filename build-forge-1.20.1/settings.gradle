// Slim build root for the Forge 1.20.1 jar only.
// The main settings.gradle configures every Fabric/Forge module (each of which downloads and
// sets up its own Minecraft version), so building one target from there is very slow.
// Usage (from the repository root, with JAVA_HOME pointing at a JDK 17):
//     ./gradlew -p build-forge-1.20.1 build
// Output: target/Dynmap-<version>-forge-1.20.1.jar
pluginManagement {
  repositories {
    gradlePluginPortal()
  }
}

rootProject.name = 'dynmap-common'

include ':DynmapCoreAPI'
include ':DynmapCore'
include ':forge-1.20.1'

project(':DynmapCoreAPI').projectDir = "$rootDir/../DynmapCoreAPI" as File
project(':DynmapCore').projectDir = "$rootDir/../DynmapCore" as File
project(':forge-1.20.1').projectDir = "$rootDir/../forge-1.20.1" as File
