plugins {
    id 'java'
    id 'eclipse'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.minecraftforge.renamer' version '1.1.2'
}

eclipse {
    project {
        name = "Dynmap(Forge-1.18.2)"
    }
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

ext.buildNumber = System.getenv().BUILD_NUMBER ?: "Dev"

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

minecraft {
    // Auto-applies src/main/resources/META-INF/accesstransformer.cfg
    accessTransformer = true
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.18.2-40.0.2')

    implementation project(path: ':DynmapCore', configuration: 'shadow')
    implementation project(path: ':DynmapCoreAPI')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filesMatching('META-INF/mods.toml') {
        // replace version and mcversion
        expand(
            version: project.version + '-' + project.ext.buildNumber,
            mcversion: "1.18.2"
        )
    }
}

shadowJar {
    dependencies {
        include(dependency(':DynmapCore'))
        include(dependency("commons-codec:commons-codec:"))
        exclude("META-INF/maven/**")
        exclude("META-INF/services/**")
    }
    relocate('org.apache.commons.codec', 'org.dynmap.forge_1_18_2.commons.codec')

    archiveBaseName = "Dynmap"
    archiveClassifier = "dev"
}

// Forge 1.18.2 uses SRG names at runtime, so the shadow jar has to be remapped
renamer.classes('renameShadowJar', tasks.named('shadowJar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    output = layout.projectDirectory.file("../target/Dynmap-${project.version}-forge-1.18.2.jar")
}

tasks.named('renameShadowJar') {
    doLast { task -> ant.checksum file: task.output.get().asFile }
}

build.dependsOn(tasks.named('renameShadowJar'))
