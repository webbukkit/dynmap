name: Build Dynmap

on:
  push:
    branches: ["v3.0-dev"]  # Branche de développement principale
  pull_request:
    branches: ["v3.0-dev"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21 (for latest Dynmap version)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Grant execute permission to Gradle wrapper
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Collect all JARs
      run: |
        mkdir -p /tmp/dynmap-jars
        find . -type f -name "*.jar" -path "*/build/libs/*" -exec cp {} /tmp/dynmap-jars/ \;

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dynmap-jars
        path: /tmp/dynmap-jars/*.jar
