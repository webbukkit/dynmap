name: Build platform jars

on:
  push:
    branches:
      - v3.0-community-edition
    tags:
      - 'ce-[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      fullVersion: ${{ steps.v.outputs.fullVersion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tag ce-X.Y.Z -> 3.10.0, N commits after it -> 3.10.1-dev.N, no tag -> 3.x-dev.
      - name: Compute version
        id: v
        shell: bash
        run: |
          hash=$(git rev-parse --short=7 HEAD)
          desc=$(git describe --tags --long --abbrev=7 --match 'ce-[0-9]*.[0-9]*.[0-9]*' --exclude 'ce-*-*' 2>/dev/null || true)
          if [[ $desc =~ ^ce-([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9]+)-g ]]; then
            if [ "${BASH_REMATCH[4]}" = 0 ]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              full="$version+$hash"
              kind="release"
            else
              base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.${BASH_REMATCH[4]}"
              version="$base-$hash"
              full="$base+$hash"
              kind="dev build, ${BASH_REMATCH[4]} commit(s) after the last tag"
            fi
          elif [ -n "$desc" ]; then
            echo "::error::Unsupported tag $desc, expected ce-X.Y.Z"
            exit 1
          else
            version="3.x-dev-$hash"
            full="3.x-dev+$hash"
            kind="dev build, no ce-* tag found"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "fullVersion=$full" >> "$GITHUB_OUTPUT"
          echo "Version: $full (jar: $version)"
          {
            echo "### Version"
            echo "- Build type: $kind"
            echo "- Ref: \`$GITHUB_REF_NAME\` @ \`$hash\`"
            echo "- Last tag: \`${desc:-none}\`"
            echo "- Jar version: \`$version\`"
            echo "- Full version (\`/dynmap version\`): \`$full\`"
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    needs: version
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_fullVersion: ${{ needs.version.outputs.fullVersion }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build core
        run: ./gradlew :DynmapCoreAPI:build :DynmapCore:build --console=plain

      - name: Upload DynmapCore jar
        uses: actions/upload-artifact@v7
        with:
          path: target/DynmapCore-*.jar
          archive: false
          if-no-files-found: error

      - name: Upload DynmapCoreAPI jar
        uses: actions/upload-artifact@v7
        with:
          path: target/DynmapCoreAPI-*.jar
          archive: false
          if-no-files-found: error

  platform:
    needs: [version, core]
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.version.outputs.version }}
      ORG_GRADLE_PROJECT_fullVersion: ${{ needs.version.outputs.fullVersion }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the platform modules in settings.gradle
        include:
          - module: spigot
            task: ':spigot:build'
            java: '25'
          - module: fabric-1.14.4
            task: ':fabric-1.14.4:build'
            java: '21'
          - module: fabric-1.15.2
            task: ':fabric-1.15.2:build'
            java: '21'
          - module: fabric-1.16.4
            task: ':fabric-1.16.4:build'
            java: '21'
          - module: fabric-1.17.1
            task: ':fabric-1.17.1:build'
            java: '21'
          - module: fabric-1.18.2
            task: ':fabric-1.18.2:build'
            java: '21'
          - module: fabric-1.19.4
            task: ':fabric-1.19.4:build'
            java: '21'
          - module: fabric-1.20.6
            task: ':fabric-1.20.6:build'
            java: '21'
          - module: fabric-1.21.6
            task: ':fabric-1.21.6:build'
            java: '21'
          - module: fabric-1.21.9-10
            task: ':fabric-1.21.9-10:build'
            java: '21'
          - module: fabric-1.21.11
            task: ':fabric-1.21.11:build'
            java: '21'
          - module: fabric-26.1
            task: ':fabric-26.1:build'
            java: '25'
          - module: forge-1.17.1
            task: ':forge-1.17.1:build'
            java: '21'
          - module: forge-1.18.2
            task: ':forge-1.18.2:build'
            java: '21'
          - module: forge-1.19.3
            task: ':forge-1.19.3:build'
            java: '21'
          - module: forge-1.20.6
            task: ':forge-1.20.6:build'
            java: '21'
          - module: forge-1.21.6
            task: ':forge-1.21.6:build'
            java: '21'
          - module: forge-1.21.10
            task: ':forge-1.21.10:build'
            java: '21'
          - module: forge-1.21.11
            task: ':forge-1.21.11:build'
            java: '21'
          - module: forge-26.1
            task: ':forge-26.1:build'
            java: '25'
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build ${{ matrix.module }}
        shell: bash
        run: ./gradlew ${{ matrix.task }} --console=plain --info --stacktrace 2>&1 | tee build-${{ matrix.module }}.log

      - name: Print build errors
        if: failure()
        shell: bash
        run: |
          echo "::group::Error lines"
          grep -n -i -E 'error|exception|caused by|failed|FAILURE|class file version' build-${{ matrix.module }}.log | tail -n 100 || true
          echo "::endgroup::"
          echo "::group::Last 200 log lines"
          tail -n 200 build-${{ matrix.module }}.log
          echo "::endgroup::"
          for f in hs_err_pid*.log; do [ -f "$f" ] && { echo "::group::$f"; head -n 60 "$f"; echo "::endgroup::"; }; done || true

      - name: Upload build logs and reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-${{ matrix.module }}
          path: |
            build-${{ matrix.module }}.log
            build/reports/
            ${{ matrix.module }}/build/reports/
            ${{ matrix.module }}/build/tmp/
            hs_err_pid*.log
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          path: target/Dynmap-*.jar
          archive: false
          if-no-files-found: error

      - name: Upload MD5
        uses: actions/upload-artifact@v7
        with:
          path: target/Dynmap-*.jar.MD5
          archive: false
          if-no-files-found: error
